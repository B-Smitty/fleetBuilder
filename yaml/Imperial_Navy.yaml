  - name: Death Squadron
    description: >-
      Darth Vader's personal Star Destroyer strike fleet, built around his flagship the Executor. A roving force not
      tied to any single sector, tasked with hunting the Rebel Alliance wherever it surfaced.
    components:
      - type: unit
        name: Executor Super Star Destroyer
        quantity: 1
      - type: unit
        name: ISD II
        quantity: 6
      - type: unit
        name: Immobilizer
        quantity: 2
  - name: Vengeance Battle Group
    description: >-
      A dreadnought-centered task force historically used by rogue elements of the Navy for independent operations
      outside normal sector command.
    components:
      - type: unit
        name: Executor Super Star Destroyer
        quantity: 1
      - type: unit
        name: ISD II
        quantity: 3
      - type: unit
        name: Nebulon-B
        quantity: 6
      - type: unit
        name: CR90
        quantity: 12
  - name: Outer Rim Standing Fleet
    description: >-
      A permanent garrison fleet kept in the Outer Rim Territories, separate from the normal sector allocation, to give
      the Navy a persistent presence far from the Core.
    components:
      - type: unit
        name: ISD II
        quantity: 19
      - type: unit
        name: Immobilizer
        quantity: 3
  - name: Emperor's Personal Fleet
    description: >-
      Emperor Palpatine's own command fleet, kept separate from Death Squadron and other named formations, deployed only
      when the Emperor's personal participation was required.
    components:
      - type: unit
        name: Sovereign Super Star Destroyer
        quantity: 1
      - type: unit
        name: ISD II
        quantity: 6
  - name: Byss Defense Fleet
    description: >-
      A standing fleet guarding the Emperor's secret world of Byss since the earliest days of the Empire, screening the
      system from discovery and unauthorized entry.
    components:
      - type: unit
        name: Bellator Star Dreadnought
        quantity: 2
      - type: unit
        name: ISD II
        quantity: 10
      - type: unit
        name: Immobilizer
        quantity: 4
  - name: Punitive Task Force
    description: >-
      An ad hoc Star Destroyer task force detached from an existing sector fleet to punish or depose a rebellious Moff
      or warlord, then folded into a new sector fleet once the job was done. Not counted in the Navy's total strength,
      since its ships are drawn from existing sector allocations rather than being additional hulls.
    components:
      - type: unit
        name: ISD II
        quantity: 3
      - type: unit
        name: Carrack
        quantity: 6
