      This unit is tasked with maintaining internal security as well as detecting and eliminating threats to the
      Empire.  They use clandestine ISB Agents spread around the sector to gather intelligence, as well as larger
      intelligence cells for specific sector problems. They have at their command a battalion of highly trained Death
      Troopers they can call on for direct action against threats, as well as a cadre of black ops Imperial Assassins,
      trained to find and kill high value targets.  



      The have a variety of mobility assets including nondescript light freighters, Imperial Lambda shuttles, and
      stealthy Delta T-3c shuttles.
